{% extends "base.html" %}
{% block title %}Agregar Cancha{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">

        <div class="mb-4">
            <a href="/panel-complejo" class="text-muted text-decoration-none small">← Volver al panel</a>
            <h1 class="h3 fw-bold mt-2">Agregar nueva cancha</h1>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-4">
                <form method="post" action="/agregar-cancha">

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nombre de la cancha <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" name="nombre"
                               placeholder="Ej: Cancha 1" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Tipo de cancha <span class="text-danger">*</span></label>
                        <select class="form-select" name="id_tipo_cancha" required>
                            <option value="">— Seleccioná el tipo —</option>
                            {% for t in tipos %}
                                <option value="{{ t.id_tipo_cancha }}">
                                    {{ t.nombre }} ({{ t.capacidad_jugadores }} jugadores)
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Precio por hora ($) <span class="text-danger">*</span></label>
                        <input type="number" class="form-control" name="precio_por_hora"
                               step="0.01" min="1" placeholder="Ej: 3500" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold d-block">Techo</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="techada" value="1" id="tech_si">
                            <label class="form-check-label" for="tech_si">Techada</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="techada" value="0" id="tech_no" checked>
                            <label class="form-check-label" for="tech_no">Al aire libre</label>
                        </div>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success fw-semibold">
                            Guardar cancha ✅
                        </button>
                        <a href="/panel-complejo" class="btn btn-outline-secondary">Cancelar</a>
                    </div>

                </form>
            </div>
        </div>

    </div>
</div>
{% endblock %}
