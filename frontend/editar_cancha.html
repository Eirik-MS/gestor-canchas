{% extends "base.html" %}
{% block title %}Editar Cancha{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">

        <div class="mb-4">
            <a href="/panel-complejo" class="text-muted text-decoration-none small">← Volver al panel</a>
            <h1 class="h3 fw-bold mt-2">Editar cancha: {{ cancha.nombre }}</h1>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-4">
                <form method="post" action="/editar-cancha/{{ cancha.id_cancha }}">

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nombre</label>
                        <input type="text" class="form-control" name="nombre"
                               value="{{ cancha.nombre }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Precio por hora ($)</label>
                        <input type="number" class="form-control" name="precio_por_hora"
                               step="0.01" min="1" value="{{ cancha.precio_por_hora }}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold d-block">Techo</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="techada" value="1"
                                   id="tech_si" {% if cancha.techada %}checked{% endif %}>
                            <label class="form-check-label" for="tech_si">Techada</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="techada" value="0"
                                   id="tech_no" {% if not cancha.techada %}checked{% endif %}>
                            <label class="form-check-label" for="tech_no">Al aire libre</label>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold d-block">Estado</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="disponible" value="1"
                                   id="disp_si" {% if cancha.disponible %}checked{% endif %}>
                            <label class="form-check-label" for="disp_si">Disponible</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="disponible" value="0"
                                   id="disp_no" {% if not cancha.disponible %}checked{% endif %}>
                            <label class="form-check-label" for="disp_no">No disponible</label>
                        </div>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success fw-semibold">Guardar cambios ✓</button>
                        <a href="/panel-complejo" class="btn btn-outline-secondary">Cancelar</a>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
