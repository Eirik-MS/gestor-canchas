{% extends "base.html" %}
{% block title %}Registrarse{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">

        <div class="text-center mb-4">
            <div style="font-size:2.5rem">👤</div>
            <h1 class="h3 fw-bold">Crear cuenta de jugador</h1>
            <p class="text-muted">Empezá a reservar canchas en minutos</p>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-4">
                <form method="post" action="/registro" novalidate>

                    <div class="row g-3">

                        <div class="col-12">
                            <label class="form-label fw-semibold">DNI <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" name="dni"
                                   value="{{ dni or '' }}"
                                   placeholder="12345678" min="1000000" max="99999999" required>
                            <div class="form-text">8 dígitos, sin puntos.</div>
                        </div>

                        <div class="col-sm-6">
                            <label class="form-label fw-semibold">Nombre <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" name="nombre"
                                   value="{{ nombre or '' }}" required>
                        </div>

                        <div class="col-sm-6">
                            <label class="form-label fw-semibold">Apellido <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" name="apellido"
                                   value="{{ apellido or '' }}" required>
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-semibold">Email <span class="text-danger">*</span></label>
                            <input type="email" class="form-control" name="email"
                                   value="{{ email or '' }}"
                                   placeholder="tu@email.com" required>
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-semibold">Teléfono</label>
                            <input type="tel" class="form-control" name="telefono"
                                   placeholder="1123456789">
                        </div>

                        <div class="col-sm-6">
                            <label class="form-label fw-semibold">Contraseña <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <input type="password" class="form-control" name="password"
                                       id="pass1" minlength="6" required>
                                <button type="button" class="btn btn-outline-secondary"
                                        onclick="togglePass('pass1', this)">👁</button>
                            </div>
                            <div class="form-text">Mínimo 6 caracteres.</div>
                        </div>

                        <div class="col-sm-6">
                            <label class="form-label fw-semibold">Confirmar contraseña <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <input type="password" class="form-control" name="confirm_password"
                                       id="pass2" required>
                                <button type="button" class="btn btn-outline-secondary"
                                        onclick="togglePass('pass2', this)">👁</button>
                            </div>
                        </div>

                    </div>

                    <button type="submit" class="btn btn-success w-100 fw-semibold py-2 mt-4">
                        Crear cuenta ✅
                    </button>

                </form>

                <p class="text-center text-muted small mt-3 mb-0">
                    ¿Ya tenés cuenta?
                    <a href="/login" class="text-success fw-semibold">Iniciá sesión</a>
                </p>
            </div>
        </div>

    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function togglePass(id, btn) {
    const input = document.getElementById(id);
    input.type = input.type === 'password' ? 'text' : 'password';
    btn.textContent = input.type === 'password' ? '👁' : '🙈';
}

document.querySelector('form').addEventListener('submit', function(e) {
    const p1 = document.getElementById('pass1').value;
    const p2 = document.getElementById('pass2').value;
    if (p1 !== p2) {
        e.preventDefault();
        alert('Las contraseñas no coinciden.');
    }
});
</script>
{% endblock %}
